# One place to choose which model does each job.
# Each node lists model keys in priority order: the first is tried first, the rest
# are fallbacks. A model is skipped automatically if its API key secret is missing.
# To change a model for any step, edit a line in [nodes] (or add a [models.*] entry).

[settings]
temperature = 0.0
max_code_retries = 2              # coder <-> executor retry loop
history_turns = 6                 # past Q&A turns kept in session memory
router_confidence_threshold = 0.5 # Decider under this confidence below this -> ask a clarifying question

# ---- model registry -------------------------------------------------------
# provider: "google_genai" | "openrouter"
# Any extra keys in an entry are passed to the provider as parameters.


[models.gemini_flash]
provider = "google_genai"
model = "gemini-3.8-flash"

[models.gemini_flash_lite]
provider = "google_genai"
model = "gemini-3.5-flash-lite"

[models.mercury_decide_free]
kind = "decision"
provider = "openrouter"
model = "inception/mercury-decide:free"

[models.north_mini_code_free]
provider = "openrouter"
model = "cohere/north-mini-code:free"

# ---- which model does which job ------------------------------------------
[nodes]
router      = ["mercury_decide_free", "gemini_flash"]                # classify the question (structured output)
rewriter    = ["gemini_flash", "gemini_flash_lite"]  # standalone follow-up rewrite + clarifying question text
coder       = ["north_mini_code_free", "gemini_flash"]   # writes the SQL / Python
synthesizer = ["gemini_flash", "gemini_flash_lite"]  # turns results into the final answer
